name: Deploy playwright to stg or prod

on:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to deploy (must match master or staging)'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - staging

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.branch_check.outputs.env_name }}
      ref: ${{ steps.branch_check.outputs.ref }}
    steps:
      - id: branch_check
        run: |
          SELECTED_BRANCH=${{ github.event.inputs.target_branch || github.ref_name }}
          echo "ref=$SELECTED_BRANCH" >> $GITHUB_OUTPUT

          if [ "$SELECTED_BRANCH" = "master" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          else
            echo "env_name=stg" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: set-env
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.env_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-env.outputs.ref }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create project directory on server
        run: |
          ssh -o StrictHostKeyChecking=no \
          root@${{ vars.SSH_HOST }} "mkdir -p /srv/playwright"

      - name: Copy project files to remote server
        run: |
          scp -o StrictHostKeyChecking=no \
            ./docker-compose.yml ./Dockerfile ./main.py \
            root@${{ vars.SSH_HOST }}:/srv/playwright/

      - name: Build and deploy on remote server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.SSH_HOST }} << 'EOF'
            cd /srv/playwright/
            docker compose -f docker-compose.yml build
            docker compose -f docker-compose.yml up -d --force-recreate --remove-orphans
            docker image prune -f
          EOF